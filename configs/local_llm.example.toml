[project]
name = "EvoTaxa Local LLM Development"
domain_id = "dev"
run_id = "local_llm_dev"

[corpus]
path = "../tests/fixtures/social/corpus.jsonl"
source_type = "social_document"
id_fields = ["doc_id", "paper_id", "id"]
title_fields = ["title"]
text_fields = ["abstract", "summary", "body_text", "text"]
date_fields = ["publication_date", "published", "date", "year"]
slice_fields = ["period", "chronology_slice", "year"]
role_fields = ["role", "benchmark_role"]
accepted_roles = ["core", "support"]
cutoff_date = "2026-03-31"

[taxonomy]
nodes_path = "../tests/fixtures/social/taxonomy_nodes.json"
assignments_path = "../tests/fixtures/social/assignments.jsonl"
expansion_enabled = true
expansion_threshold = 0.35
min_cluster_documents = 1
coevolution_enabled = true
max_coevolution_iterations = 1
max_revision_candidates = 30
max_applied_revisions = 10
revision_acceptance_threshold = 0.58

[taxonomy.dimensions.mechanisms]
display_name = "Mechanisms"
definition = "Explanatory social, behavioral, institutional, or communication mechanisms."

[taxonomy.dimensions.interventions]
display_name = "Interventions"
definition = "Policy instruments, platform interventions, and program designs."

[schema]
entity_schema_mode = "adaptive"
relation_schema_mode = "adaptive"
evidence_schema_mode = "adaptive"
schema_inference_sample_size = 30
schema_revision_min_support = 2
max_schema_revisions = 3

[graph]
entity_dimensions = ["mechanisms", "interventions"]
entity_types = ["intervention", "policy_instrument", "explanatory_mechanism", "measurement_strategy", "public_frame"]
method_cue_terms = ["intervention", "policy", "mechanism", "measurement", "frame", "governance", "audit", "moderation"]
min_entity_mentions = 1
llm_entity_extraction_limit = 12
llm_edge_judge_limit = 100
trusted_edge_confidence_threshold = 0.65
candidate_edge_confidence_threshold = 0.35
require_verified_evidence_for_trusted = true

[graph.entity_patterns]
intervention = ["inoculation intervention", "community moderation", "platform labeling"]
policy_instrument = ["transparency mandate", "algorithmic audit"]

[llm]
provider = "openai_compat"
model_name = "your-model-name"
api_key = "token-abc123"
base_url = "http://localhost:8001/v1"
enabled_tasks = ["entity_extraction", "taxonomy_candidate_judge", "edge_evidence_judge", "relation_schema_inference", "entity_evidence_schema_inference"]

[output]
root = "../examples/local_llm_output"
