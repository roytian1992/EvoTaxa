[project]
name = "EvoTaxa Qwen Local LLM Development"
domain_id = "misinformation_governance"
run_id = "qwen_local_llm_dev"

[corpus]
path = "../tests/fixtures/social/corpus.jsonl"
source_type = "social_document"
id_fields = ["doc_id", "paper_id", "id"]
title_fields = ["title"]
text_fields = ["abstract", "summary", "body_text", "text"]
date_fields = ["publication_date", "published", "date", "year"]
slice_fields = ["period", "chronology_slice", "year"]
role_fields = ["role", "benchmark_role"]
accepted_roles = ["core", "support"]
cutoff_date = "2026-03-31"

[taxonomy]
nodes_path = "../tests/fixtures/social/taxonomy_nodes.json"
assignments_path = "../tests/fixtures/social/assignments.jsonl"
expansion_enabled = true
expansion_threshold = 0.35
min_cluster_documents = 1
coevolution_enabled = true
max_coevolution_iterations = 1
max_revision_candidates = 30
max_applied_revisions = 10
revision_acceptance_threshold = 0.58

[taxonomy.dimensions.mechanisms]
display_name = "Mechanisms"
definition = "Explanatory social, behavioral, institutional, or communication mechanisms."

[taxonomy.dimensions.interventions]
display_name = "Interventions"
definition = "Policy instruments, platform interventions, and program designs."

[taxonomy.dimensions.measurement_strategies]
display_name = "Measurement Strategies"
definition = "Operationalizations, audit methods, experiments, and metrics."

[taxonomy.dimensions.public_frames]
display_name = "Public Frames"
definition = "Narratives, discourses, and issue framings."

[schema]
entity_schema_mode = "fixed"
relation_schema_mode = "fixed"
evidence_schema_mode = "fixed"
schema_inference_sample_size = 4
schema_revision_min_support = 2
max_schema_revisions = 3

[graph]
entity_dimensions = ["mechanisms", "interventions", "measurement_strategies", "public_frames"]
entity_types = ["intervention", "policy_instrument", "explanatory_mechanism", "measurement_strategy", "public_frame"]
method_cue_terms = ["intervention", "policy", "mechanism", "measurement", "frame", "governance", "audit", "moderation"]
min_entity_mentions = 1
max_entities_per_document = 12
max_edge_candidates_per_entity = 12
max_pair_groups_per_node = 16
min_entity_quality = 0.42
llm_entity_extraction_limit = 4
llm_taxonomy_judge_limit = 4
llm_relation_extraction_limit = 4
llm_relation_batch_size = 2
llm_edge_judge_limit = 0
trusted_edge_confidence_threshold = 0.65
candidate_edge_confidence_threshold = 0.35
require_verified_evidence_for_trusted = true

[graph.entity_patterns]
intervention = ["inoculation intervention", "community moderation", "platform labeling", "content labeling"]
policy_instrument = ["transparency mandate", "algorithmic audit"]
measurement_strategy = ["network audit", "survey experiment"]
public_frame = ["platform governance frame", "individual responsibility frame"]

[graph.entity_aliases]
"platform labeling" = ["content labeling", "labeling intervention", "platform labels"]
"algorithmic audit" = ["algorithm audit", "algorithmic auditing"]

[llm]
provider = "openai_compat"
model_name = "Qwen3.5-397B-A17B-FP8"
api_key_env = "EVOTAXA_LLM_API_KEY"
base_url = "http://127.0.0.1:8001/v1"
prompt_dir = "../task_specs/prompts"
system_prompt_id = "llm/system_json"
enabled_tasks = [
  "entity_extraction",
  "taxonomy_candidate_judge",
  "relation_extraction_batch",
  "edge_evidence_judge",
  "schema_revision_judge"
]
max_retries = 1
timeout_seconds = 60
temperature = 0.0
max_workers = 16

[llm.extra_body.chat_template_kwargs]
enable_thinking = false

[macro_patterns]
enabled = true
min_pattern_score = 0.2
max_patterns = 20
max_evidence_per_pattern = 8
use_negative_evidence = true
llm_summary_enabled = false

[temporal_windows]
enabled = true
scope_types = ["global", "taxonomy_node", "entity_type", "relation_type"]
min_documents_per_window = 2
min_mentions_per_window = 3
min_edges_per_window = 3
min_duration_days = 1
max_duration_days = 730

[output]
root = "../examples/qwen_local_llm_output"
