[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evotaxa"
version = "0.1.0"
description = "Config-driven taxonomy-guided evolution modeling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "EvoTaxa Contributors" }
]
dependencies = [
  "json-repair>=0.44.1",
  "PyYAML>=6.0.1",
]

[project.scripts]
evotaxa = "evotaxa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
